<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand">Drawings</span>
        <div class="d-flex align-items-center gap-2">
            <span class="text-light me-2" th:text="${session.username}"></span>
            <a class="btn btn-sm btn-outline-light" th:href="@{/dibuix}">Nou dibuix</a>
            <a class="btn btn-sm btn-outline-light" th:href="@{/historial}">Historial</a>
            <a class="btn btn-sm btn-danger" th:href="@{/logout}">Tancar sessió</a>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <h1 class="h4 mb-3">
        <span th:if="${draw == null}">Nou dibuix</span>
        <span th:if="${draw != null}" th:text="${draw.name}"></span>
    </h1>

    <!-- Avís quan es visualitza un dibuix d'un altre usuari -->
    <div class="alert alert-info" th:if="${draw != null and !propietari}">
        Estàs veient un dibuix de <strong th:text="${draw.owner}"></strong>. Només el pots visualitzar, no guardar-lo.
    </div>

    <!-- Barra d'eines -->
    <div class="d-flex flex-wrap align-items-center gap-2 mb-3" th:if="${draw == null or propietari}">
        <div class="btn-group" role="group">
            <button type="button" class="btn btn-outline-primary" id="circle">Cercle</button>
            <button type="button" class="btn btn-outline-primary" id="square">Quadrat</button>
            <button type="button" class="btn btn-outline-primary" id="triangle">Triangle</button>
            <button type="button" class="btn btn-outline-primary" id="star">Estrella</button>
            <button type="button" class="btn btn-outline-primary" id="freehand">Mà alçada</button>
            <button type="button" class="btn btn-outline-primary" id="line">Línia</button>
        </div>
        <label class="ms-3 mb-0" for="color">Color</label>
        <input class="form-control form-control-color" type="color" name="color" id="color">
        <label class="ms-3 mb-0" for="size">Mida</label>
        <input class="form-range" style="width: 150px;" type="range" min="1" max="100" value="50" name="tamany" id="size">
    </div>

    <div id="editor">
        <!-- Canvas -->
        <div class="canvas-wrap">
            <canvas id="canvas" width="800" height="600"></canvas>
        </div>

        <!-- Llista d'objectes + desar -->
        <div class="panell">
            <div class="card mb-3">
                <div class="card-header">Objectes</div>
                <ul id="llista" class="list-group list-group-flush"></ul>
                <div class="card-body" th:if="${draw == null or propietari}">
                    <button type="button" class="btn btn-outline-danger btn-sm w-100" id="esborrarTot">Esborrar tot</button>
                </div>
            </div>

            <!-- Només es pot desar un dibuix nou o un de propi -->
            <div class="card" th:if="${draw == null or propietari}">
                <div class="card-header">Desar dibuix</div>
                <div class="card-body">
                    <form method="post" th:action="@{/dibuix/save}" id="saveForm">
                        <input type="hidden" name="id" th:value="${draw != null ? draw.id : 0}">
                        <input type="hidden" name="objects" id="objects">
                        <input type="hidden" name="objectCount" id="objectCount">
                        <div class="mb-2">
                            <label class="form-label" for="drawName">Nom</label>
                            <input class="form-control" type="text" name="name" id="drawName"
                                   placeholder="Aleatori si el deixes buit"
                                   th:value="${draw != null ? draw.name : ''}">
                        </div>
                        <button type="submit" class="btn btn-success w-100">Guardar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Dibuix carregat des del servidor: el JSON de draw.objects, o null si és un dibuix nou -->
<script th:inline="javascript">
    const dibuixInicial = /*[[${draw != null ? draw.objects : null}]]*/ null;
    // true quan es visualitza un dibuix d'un altre usuari: no es pot modificar
    const nomesLectura = /*[[${draw != null and !propietari}]]*/ false;
</script>
<script th:src="@{/js/editor.js}"></script>
</body>
</html>
