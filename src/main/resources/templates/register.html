<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registre</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 420px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h3 mb-4 text-center">Registre</h1>
            <div class="alert alert-danger" th:if="${message}" th:text="${message}"></div>
            <form method="post" th:action="@{/register}">
                <div class="mb-3">
                    <label class="form-label" for="name">Nom</label>
                    <input class="form-control" type="text" id="name" name="name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="username">Nom d'usuari</label>
                    <input class="form-control" type="text" id="username" name="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password1">Contrasenya</label>
                    <input class="form-control" type="password" id="password1" name="password1" required>
                    <div class="form-text">Mínim 5 caràcters.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password2">Repeteix la contrasenya</label>
                    <input class="form-control" type="password" id="password2" name="password2" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Crea el compte</button>
            </form>
            <p class="mt-3 mb-0 text-center">Ja tens compte? <a th:href="@{/login}">Inicia sessió</a></p>
        </div>
    </div>
</div>
</body>
</html>
