<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand">Drawings</span>
        <div class="d-flex align-items-center gap-2">
            <span class="text-light me-2" th:text="${session.username}"></span>
            <a class="btn btn-sm btn-outline-light" th:href="@{/dibuix}">Nou dibuix</a>
            <a class="btn btn-sm btn-outline-light" th:href="@{/historial}">Historial</a>
            <a class="btn btn-sm btn-danger" th:href="@{/logout}">Tancar sessió</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Historial</h1>
        <div class="btn-group">
            <a class="btn btn-sm" th:href="@{/historial}"
               th:classappend="${filtre == 'tots'} ? 'btn-outline-primary' : 'btn-primary'">Els meus</a>
            <a class="btn btn-sm" th:href="@{/historial/tots}"
               th:classappend="${filtre == 'tots'} ? 'btn-primary' : 'btn-outline-primary'">Tots</a>
        </div>
    </div>

    <div class="alert alert-info" th:if="${#lists.isEmpty(draws)}">No hi ha cap dibuix.</div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(draws)}">
        <table class="table table-striped align-middle bg-white">
            <thead>
            <tr>
                <th>Nom</th>
                <th>Propietari</th>
                <th>Objectes</th>
                <th>Creat</th>
                <th>Modificat</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="d : ${draws}">
                <td th:text="${d.name}"></td>
                <td th:text="${d.owner}"></td>
                <td th:text="${d.objectCount}"></td>
                <td th:text="${#temporals.format(d.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${#temporals.format(d.updatedAt, 'dd/MM/yyyy HH:mm')}"></td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/dibuix/{id}(id=${d.id})}"
                       th:text="${d.owner == session.username} ? 'Editar' : 'Veure'"></a>
                    <form class="d-inline" method="post" th:action="@{/dibuix/{id}/delete(id=${d.id})}"
                          th:if="${d.owner == session.username}">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Esborrar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
